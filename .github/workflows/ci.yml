# Offline checks only. Nothing here has AWS credentials, and nothing needs them: the
# unit suite replaces every boto3 client and urlopen with a fake, so no request can
# reach a deployed platform. Deploying and the integration scripts stay manual,
# because they spend money and write to a live hotel system.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to a full commit SHA, with the release in a comment. A tag can be
# moved to different code after the fact; a SHA cannot.

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The Lambda and AgentCore Runtime version this deploys to.
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  console-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Active LTS. 20 reached end of life in April 2026.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
